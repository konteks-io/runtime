name: ci
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Point the contract links at vendor/ (the dev branch links ../packages, absent here)
        shell: bash
        run: |
          node scripts/ci-vendored-contracts.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install (shared contracts are vendored under vendor/)
        run: npm ci --ignore-scripts
      - name: Verify the Codex patch against the reviewed upstream source
        shell: bash
        env:
          CODEX_ACP_FIXTURE_DIR: ${{ runner.temp }}/codex-acp-pristine/package/dist
        run: |
          curl -fSL --proto '=https' --tlsv1.2 --max-time 120 -o "$RUNNER_TEMP/codex-acp-1.10.0.tgz" 'https://registry.npmjs.org/@agentclientprotocol/codex-acp/-/codex-acp-1.10.0.tgz'
          echo "9dffb525b728d0579a8b19d48322281ecad7eea7ba1640fa2f8de1199346352c  $RUNNER_TEMP/codex-acp-1.10.0.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/codex-acp-pristine"
          tar -xzf "$RUNNER_TEMP/codex-acp-1.10.0.tgz" -C "$RUNNER_TEMP/codex-acp-pristine"
          node --test scripts/codex-acp-live-user-patch.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:agpl
      - run: npm run check:secret-canary
      - name: Bootstrap scripts are well-formed
        run: |
          sh -n bootstrap/install.sh
          bootstrap/install.sh --version
      - name: The Windows bootstrap parses (it failed to load on every Windows computer until 0.10.8)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bootstrap/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  windows-bootstrap:
    # install.ps1 trusts the MSI through its own Ed25519 check of the signed
    # SHA256SUMS (there is no Windows code-signing certificate yet), so that
    # check runs where people run it: Windows PowerShell 5.1, and pwsh too.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Ed25519 verifier in Windows PowerShell 5.1 (RFC 8032 vectors, a real release manifest)
        shell: powershell
        run: .\scripts\test-bootstrap-verifier.ps1
      - name: Windows OS architecture support in PowerShell 5.1
        shell: powershell
        run: .\scripts\test-bootstrap-platform.ps1
      - name: Windows OS architecture support in PowerShell 7
        shell: pwsh
        run: .\scripts\test-bootstrap-platform.ps1
      - name: The same in PowerShell 7
        shell: pwsh
        run: .\scripts\test-bootstrap-verifier.ps1
      - name: Windows installation and update outcomes in PowerShell 5.1
        shell: powershell
        run: node --test --test-name-pattern="Windows bootstrap" scripts/bootstrap-install.test.mjs
      - name: The same installation and update outcomes in PowerShell 7
        shell: pwsh
        env:
          KONTEKS_TEST_POWERSHELL: pwsh.exe
        run: node --test --test-name-pattern="Windows bootstrap" scripts/bootstrap-install.test.mjs
      - name: Setup identity and animated progress in Windows PowerShell 5.1
        shell: powershell
        run: node --test scripts/bootstrap-progress.test.mjs
      - name: The same foreground progress in PowerShell 7
        shell: pwsh
        env:
          KONTEKS_TEST_POWERSHELL: pwsh.exe
        run: node --test scripts/bootstrap-progress.test.mjs

  windows-native:
    name: native runtime on ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Point the contract links at vendor/
        shell: bash
        run: |
          node scripts/ci-vendored-contracts.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install (shared contracts are vendored under vendor/)
        run: npm ci --ignore-scripts
      - name: Build workspace packages
        run: npm run build
      - name: Verify Mac binary compatibility decisions and produced native metadata
        run: node --test --test-concurrency=1 scripts/macos-artifact-compatibility.test.mjs scripts/macos-codex-resource-owners.test.mjs scripts/macos-codex-resource-preparation.test.mjs scripts/macos-codex-resources.test.mjs scripts/macos-voice-resource-closure.test.mjs
      - name: Verify Mac resource inspection refusals on every native coordinate
        run: node --test --test-concurrency=1 scripts/mac13-resource-probe/inspect-candidate.test.mjs scripts/mac13-resource-probe/probe.test.mjs scripts/mac13-resource-probe/cpal-patch.test.mjs scripts/mac13-resource-probe/voice-helper-relocation.test.mjs scripts/mac13-resource-probe/pipeline.test.mjs
      - name: Verify reviewed Graft prebuild selection and native parser smoke boundaries
        run: node --test --test-concurrency=1 scripts/offline-graft-prebuilds.test.mjs
      - name: Verify POSIX setup language, signed downloads and recovery
        if: runner.os != 'Windows'
        run: node --test --test-name-pattern="POSIX bootstrap" scripts/bootstrap-install.test.mjs
      - name: Verify POSIX setup identity and animated progress
        if: runner.os != 'Windows'
        run: node --test scripts/bootstrap-progress.test.mjs
      - name: Verify foreground setup and update language on each native OS
        run: npx vitest run --maxWorkers=1 packages/launcher/src/__tests__/setup-locale.test.ts packages/launcher/src/__tests__/foreground-progress.test.ts packages/launcher/src/__tests__/native-install.test.ts packages/launcher/src/__tests__/agent-setup.test.ts packages/launcher/src/__tests__/prompt-output.test.ts packages/launcher/src/__tests__/prompt-interruption.test.ts
      - name: Verify native service, updates and background process ownership
        run: npx vitest run --maxWorkers=1 packages/common/src/__tests__/process-spawn.test.ts packages/common/src/__tests__/retained-process-owner.test.ts packages/common/src/__tests__/secret-file.test.ts packages/launcher/src/__tests__/native-service.test.ts packages/launcher/src/__tests__/native-service-refresh.test.ts packages/launcher/src/__tests__/native-service-diagnostics.test.ts packages/launcher/src/__tests__/native-stop-completion.test.ts packages/launcher/src/__tests__/native-update.test.ts packages/launcher/src/__tests__/native-update-progress.test.ts packages/launcher/src/__tests__/native-agent-add.test.ts packages/launcher/src/__tests__/windows-service-owner.test.ts packages/launcher/src/__tests__/windows-background-setup.test.ts packages/launcher/src/__tests__/launcher-delegate.test.ts packages/supervisor/src/__tests__/native-installation.test.ts packages/supervisor/src/__tests__/native-update-coordinator.test.ts packages/supervisor/src/__tests__/runtime-update.test.ts packages/supervisor/src/__tests__/runtime-update-ownership.test.ts packages/supervisor/src/__tests__/runtime-update-capability.test.ts packages/supervisor/src/__tests__/runtime-relay-handshake.test.ts packages/supervisor/src/__tests__/windows-launcher.test.ts packages/supervisor/src/__tests__/windows-background-probes.test.ts packages/agent-runner/src/__tests__/windows-background-spawn.test.ts
      - name: Verify Windows legacy migration and command diagnostics on each native OS
        run: npx vitest run --maxWorkers=1 packages/launcher/src/__tests__/windows-background.test.ts packages/launcher/src/__tests__/windows-command-output.test.ts
      - name: Verify current Codex tooling, model choice and fresh readiness on each native OS
        run: npx vitest run --maxWorkers=1 packages/agent-runner/src/__tests__/bridge-spec.test.ts packages/agent-runner/src/__tests__/model-capability-discovery.test.ts packages/agent-runner/src/__tests__/session-model-selection.test.ts packages/supervisor/src/__tests__/session.test.ts packages/supervisor/src/__tests__/native-execution-ready.test.ts packages/supervisor/src/__tests__/heartbeat.test.ts packages/supervisor/src/__tests__/native-inventory.test.ts packages/supervisor/src/__tests__/native-supervisor.test.ts
      - name: Verify signed Windows local release
        if: runner.os == 'Windows'
        run: npx vitest run --maxWorkers=1 packages/launcher/src/__tests__/e2e-smoke-release.test.ts -t "adds a real Windows connector and Codex package to the signed local release"
      - name: Verify organization Skill staging on Windows
        if: runner.os == 'Windows'
        run: npx vitest run --maxWorkers=1 packages/supervisor/src/__tests__/skill-staging.test.ts -t "retains digest-bound executable metadata on Windows instead of guessing it from stat"
      - name: Set up pinned Mac resource build tools before packaging
        timeout-minutes: 35
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos-resources
      - name: Preflight the actual offline Mac agent and Graft packages before release
        id: macos-offline-preflight
        timeout-minutes: 120
        if: runner.os == 'macOS'
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          REDISTRIBUTION_APPROVAL_REF: ${{ vars.KONTEKS_AGENT_REDISTRIBUTION_APPROVAL_REF }}
        run: |
          set -euo pipefail
          test -n "$REDISTRIBUTION_APPROVAL_REF" || { echo "KONTEKS_AGENT_REDISTRIBUTION_APPROVAL_REF variable is required"; exit 1; }
          case "$MATRIX_OS" in
            macos-26) architecture=arm64 ;;
            macos-15-intel) architecture=amd64 ;;
            *) echo "Unsupported Mac package preflight coordinate: $MATRIX_OS"; exit 1 ;;
          esac
          output="$RUNNER_TEMP/konteks-offline-compatibility"
          mkdir -p "$output"
          failed=0
          for agent in claude-code codex; do
            echo "Inspecting the complete $agent package for macos/$architecture"
            if ! node scripts/build-offline-agent.mjs --agent "$agent" --os macos --architecture "$architecture" --approval "$REDISTRIBUTION_APPROVAL_REF" --out "$output/$agent-macos-$architecture.tgz" --profile "$output/$agent-macos-$architecture.profile.json"; then
              failed=1
            fi
          done
          echo "Inspecting the complete Graft package for macos/$architecture"
          if ! node scripts/build-offline-tool.mjs --tool graft --architecture "$architecture" --out "$output/konteks-graft-macos-$architecture.tgz"; then
            failed=1
          fi
          exit "$failed"
      - name: Bound the selected resource measurement diagnostics before upload
        id: mac13-resource-diagnostic-bounds
        if: runner.os == 'macOS' && !cancelled() && (steps.macos-offline-preflight.outcome == 'success' || steps.macos-offline-preflight.outcome == 'failure')
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=128 --input-type=module <<'NODE'
          import { lstat, readdir, realpath, appendFile } from 'node:fs/promises';
          import { join, resolve } from 'node:path';
          const root = join(await realpath(process.env.RUNNER_TEMP), 'mac13-resource-probe-evidence');
          let rootInfo = null;
          try {
            rootInfo = await lstat(root);
          } catch (error) {
            if (error.code !== 'ENOENT') throw error;
          }
          if (rootInfo === null) {
            await appendFile(process.env.GITHUB_OUTPUT, 'ready=false\n');
            console.log('No owned Mac resource measurement evidence was created.');
          } else {
            if (!rootInfo.isDirectory() || rootInfo.isSymbolicLink() || await realpath(root) !== resolve(root)) throw Error('invalid diagnostic root');
            const logs = join(root, 'logs');
            const logInfo = await lstat(logs);
            if (!logInfo.isDirectory() || logInfo.isSymbolicLink()) throw Error('invalid diagnostic logs');
            const names = await readdir(logs);
            if (names.length > 1024) throw Error('diagnostic file cap');
            let total = 0;
            for (const name of names) {
              if (!/^[0-9]{3,}-[a-z0-9-]+\.log$/.test(name)) throw Error('unexpected diagnostic name');
              const info = await lstat(join(logs, name));
              if (!info.isFile() || info.isSymbolicLink() || info.size > 4 * 1024 ** 2) throw Error('diagnostic member cap');
              total += info.size;
            }
            if (total > 16 * 1024 ** 2) throw Error('aggregate diagnostic cap');
            try {
              const receipt = await lstat(join(root, 'receipt.json'));
              if (!receipt.isFile() || receipt.isSymbolicLink() || receipt.size > 8 * 1024 ** 2) throw Error('receipt cap');
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
            }
            await appendFile(process.env.GITHUB_OUTPUT, 'ready=true\n');
          }
          NODE
      - name: Retain bounded Mac resource measurements only
        if: runner.os == 'macOS' && !cancelled() && (steps.macos-offline-preflight.outcome == 'success' || steps.macos-offline-preflight.outcome == 'failure') && steps.mac13-resource-diagnostic-bounds.outputs.ready == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: mac13-resource-measurement-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/mac13-resource-probe-evidence/logs/*.log
            ${{ runner.temp }}/mac13-resource-probe-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 14

name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Point the contract links at vendor/ (the dev branch links ../packages, absent here)
        shell: bash
        run: |
          node scripts/ci-vendored-contracts.mjs
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install (shared contracts are vendored under vendor/)
        run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:agpl
      - run: npm run check:secret-canary
      - name: Bootstrap scripts are well-formed
        run: |
          sh -n bootstrap/install.sh
          bootstrap/install.sh --version

  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Point the contract links at vendor/
        shell: bash
        run: |
          node scripts/ci-vendored-contracts.mjs
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install (shared contracts are vendored under vendor/)
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build workspace packages
        run: npm run build
      - name: Verify Windows service and process ownership
        run: npx vitest run --maxWorkers=1 packages/common/src/__tests__/retained-process-owner.test.ts packages/common/src/__tests__/secret-file.test.ts packages/launcher/src/__tests__/native-service.test.ts packages/launcher/src/__tests__/native-update.test.ts
      - name: Verify signed Windows local release
        run: npx vitest run --maxWorkers=1 packages/launcher/src/__tests__/e2e-smoke-release.test.ts -t "adds a real Windows connector and Codex package to the signed local release"

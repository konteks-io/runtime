# Konteks Remote Instance — versioned Compose template (config schema 1).
#
# This file is an implementation detail of `konteks-remote`; its digest is
# pinned in the signed release manifest and the launcher refuses to render a
# template whose digest differs (`bundle_untrusted`). Every value that varies
# per install is interpolated from the launcher-rendered `.env`: image
# references are always `ref@sha256:…` (never a tag), the agent set and each
# agent's auth mode select Compose profiles, and the restricted install root
# provides the per-component volumes.
#
# Isolation model (installation-and-auth.md, security-operations-observability.md):
#   control   internal: supervisor <-> gateway admin / sysmon / browser tool /
#             runners / Harness / Validation. No route to the internet.
#   keyed     internal: gateway-keyed runners <-> gateway proxy. A keyed runner
#             is on `control` + `keyed` only, so its ONLY provider route is the
#             gateway.
#   stores    internal: Harness/Validation <-> their Postgres + Valkey.
#   egress    routable: supervisor (Core + relay), gateway (providers),
#             subscription runners (their own provider login), Harness and
#             Validation (VCS / package registries).
#
# Nothing mounts the Docker socket or a host credential directory. Every
# service runs as a fixed non-root uid, read-only root filesystem, all
# capabilities dropped, no-new-privileges, bounded pids/memory/cpu, rotated
# logs, and its own volume; no service can read another's store, the
# supervisor key, gateway memory, or another agent's credential volume.

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  platform: "linux/${KONTEKS_PLATFORM_ARCH:?}"
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  tmpfs:
    - /tmp:size=256m,mode=1777

x-small: &small
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M

x-medium: &medium
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 1G

x-large: &large
  deploy:
    resources:
      limits:
        cpus: "2.00"
        memory: 4G

x-runner-base: &runner-base
  <<: *hardening
  pids_limit: 2048
  deploy:
    resources:
      limits:
        cpus: "2.00"
        memory: 3G
  depends_on:
    supervisor:
      condition: service_healthy

# YAML merge is shallow, so the shared runner environment is its own anchor
# and every runner merges it into its `environment` map explicitly.
x-runner-env: &runner-env
  RUNNER_PORT: "41840"
  RUNNER_CREDENTIAL_DIR: /credentials
  RUNNER_WORKSPACE_DIR: /workspace
  RUNNER_BRIDGE_PREFIX: /opt/konteks/bridges
  RUNNER_BROWSER_TOOL_URL: http://browser-tool:41850/mcp

networks:
  control:
    internal: true
  keyed:
    internal: true
  stores:
    internal: true
  egress: {}

secrets:
  harness_postgres_password:
    file: "${KONTEKS_STORES_DIR:?}/harness-postgres.password"
  validation_postgres_password:
    file: "${KONTEKS_STORES_DIR:?}/validation-postgres.password"
  valkey_password:
    file: "${KONTEKS_STORES_DIR:?}/valkey.password"

services:
  # ── Stores ────────────────────────────────────────────────────────────────
  harness-postgres:
    <<: [*hardening, *medium]
    image: "${KONTEKS_POSTGRES_IMAGE:?}"
    user: "70:70"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/postgresql:size=16m,mode=0770,uid=70,gid=70
    environment:
      POSTGRES_USER: harness
      POSTGRES_DB: harness
      POSTGRES_PASSWORD_FILE: /run/secrets/harness_postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [harness_postgres_password]
    volumes:
      - "${KONTEKS_ROOT:?}/harness/postgres:/var/lib/postgresql/data"
    networks: [stores]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  validation-postgres:
    <<: [*hardening, *medium]
    image: "${KONTEKS_POSTGRES_IMAGE:?}"
    user: "70:70"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/postgresql:size=16m,mode=0770,uid=70,gid=70
    environment:
      POSTGRES_USER: validation
      POSTGRES_DB: validation
      POSTGRES_PASSWORD_FILE: /run/secrets/validation_postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [validation_postgres_password]
    volumes:
      - "${KONTEKS_ROOT:?}/validation-runtime/postgres:/var/lib/postgresql/data"
    networks: [stores]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation -d validation"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  valkey:
    <<: [*hardening, *small]
    image: "${KONTEKS_VALKEY_IMAGE:?}"
    user: "999:999"
    command: ["sh", "-c", "exec valkey-server --save '' --appendonly no --requirepass \"$(cat /run/secrets/valkey_password)\""]
    secrets: [valkey_password]
    networks: [stores]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$(cat /run/secrets/valkey_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ── Appliance ─────────────────────────────────────────────────────────────
  sysmon:
    <<: [*hardening, *small]
    image: "${KONTEKS_SYSMON_IMAGE:?}"
    user: "10020:10020"
    environment:
      SYSMON_PORT: "41830"
      SYSMON_DATA_ROOT: /data
    volumes:
      # Free-space measurement only: a secret-free directory on the install root's filesystem.
      - "${KONTEKS_ROOT:?}/logs:/data:ro"
    networks: [control]

  gateway:
    <<: [*hardening, *medium]
    image: "${KONTEKS_GATEWAY_IMAGE:?}"
    user: "10011:10011"
    environment:
      GATEWAY_PROXY_PORT: "41810"
      GATEWAY_ADMIN_PORT: "41811"
      GATEWAY_ALLOWLIST_FILE: /etc/konteks/egress-allowlist.json
      GATEWAY_INSTANCE_ID_FILE: /etc/konteks/instance-id
      GATEWAY_SUPERVISOR_URL: http://supervisor:41820
      GATEWAY_VERSION: "${KONTEKS_BUNDLE_VERSION:?}"
    volumes:
      # Configuration only (verified allowlist + instance id); keys never touch disk.
      - "${KONTEKS_ROOT:?}/gateway:/etc/konteks:ro"
    networks: [control, keyed, egress]

  browser-tool:
    <<: [*hardening, *large]
    image: "${KONTEKS_BROWSER_TOOL_IMAGE:?}"
    user: "pwuser"
    shm_size: 512m
    environment:
      BROWSER_TOOL_PORT: "41850"
      BROWSER_TOOL_ALLOWED_ORIGINS: "${KONTEKS_BROWSER_TOOL_ALLOWED_ORIGINS:-}"
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/pwuser/.cache:size=256m
    volumes:
      - "${KONTEKS_ROOT:?}/browser-tool:/data"
    # No provider route: control network only.
    networks: [control]

  supervisor:
    <<: [*hardening, *medium]
    image: "${KONTEKS_SUPERVISOR_IMAGE:?}"
    user: "10010:10010"
    environment:
      SUPERVISOR_DATA_DIR: /data
      SUPERVISOR_CORE_URL: "${KONTEKS_CORE_URL:?}"
      SUPERVISOR_RELAY_URL: "${KONTEKS_RELAY_URL:-}"
      SUPERVISOR_CONTROL_PORT: "41800"
      SUPERVISOR_INTERNAL_PORT: "41820"
      SUPERVISOR_GATEWAY_ADMIN_URL: http://gateway:41811
      SUPERVISOR_SYSMON_URL: http://sysmon:41830
      SUPERVISOR_HARNESS_URL: http://harness:3000
      SUPERVISOR_VALIDATION_URL: http://validation-runtime:3100
      SUPERVISOR_BROWSER_TOOL_URL: http://browser-tool:41850/mcp
      SUPERVISOR_RUNNER_URLS: "${KONTEKS_RUNNER_URLS:-}"
      SUPERVISOR_BUNDLE_VERSION: "${KONTEKS_BUNDLE_VERSION:?}"
      SUPERVISOR_PLATFORM_OS: "${KONTEKS_PLATFORM_OS:?}"
      SUPERVISOR_PLATFORM_ARCH: "${KONTEKS_PLATFORM_ARCH:?}"
      SUPERVISOR_RELEASE_MANIFEST_FILE: /etc/konteks/release-manifest.json
      SUPERVISOR_RELEASE_ROOTS_FILE: /etc/konteks/release-roots.json
    ports:
      # Loopback-only control socket for the launcher; never a public port.
      - "127.0.0.1:${KONTEKS_CONTROL_PORT:-41800}:41800"
    volumes:
      # The ONLY mount of the restricted supervisor volume (instance key, lease, journal, outbox).
      - "${KONTEKS_ROOT:?}/supervisor:/data"
      - "${KONTEKS_ROOT:?}/compose/release-manifest.json:/etc/konteks/release-manifest.json:ro"
      - "${KONTEKS_ROOT:?}/compose/release-roots.json:/etc/konteks/release-roots.json:ro"
    networks: [control, egress]
    depends_on:
      gateway:
        condition: service_healthy
      sysmon:
        condition: service_healthy

  # ── Domain components (pulled by digest from their own repositories) ─────
  # CONTRACT-GAP: CP4/CP5 have not yet published the Harness and Validation
  # image environment contracts (store URLs, data roots, health/metrics
  # ports, task-checkout projection path). The variables below are this
  # bundle's proposal and must be mirrored by those images or amended here
  # together with the compose template digest.
  harness:
    <<: [*hardening, *large]
    image: "${KONTEKS_HARNESS_IMAGE:?}"
    user: "10060:10060"
    environment:
      HARNESS_PORT: "3000"
      HARNESS_DATA_DIR: /data
      HARNESS_SUPERVISOR_URL: http://supervisor:41820
      HARNESS_POSTGRES_HOST: harness-postgres
      HARNESS_POSTGRES_DB: harness
      HARNESS_POSTGRES_USER: harness
      HARNESS_POSTGRES_PASSWORD_FILE: /run/secrets/harness_postgres_password
      HARNESS_VALKEY_HOST: valkey
      HARNESS_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    secrets: [harness_postgres_password, valkey_password]
    volumes:
      - "${KONTEKS_ROOT:?}/harness/data:/data"
    networks: [control, stores, egress]
    depends_on:
      harness-postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      supervisor:
        condition: service_healthy

  validation-runtime:
    <<: [*hardening, *large]
    image: "${KONTEKS_VALIDATION_IMAGE:?}"
    user: "10061:10061"
    environment:
      VALIDATION_PORT: "3100"
      VALIDATION_DATA_DIR: /data
      VALIDATION_SUPERVISOR_URL: http://supervisor:41820
      VALIDATION_TASK_CHECKOUT_DIR: /checkouts
      VALIDATION_PREVIEW_ORIGIN: http://127.0.0.1:4173
      VALIDATION_POSTGRES_HOST: validation-postgres
      VALIDATION_POSTGRES_DB: validation
      VALIDATION_POSTGRES_USER: validation
      VALIDATION_POSTGRES_PASSWORD_FILE: /run/secrets/validation_postgres_password
      VALIDATION_VALKEY_HOST: valkey
      VALIDATION_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    secrets: [validation_postgres_password, valkey_password]
    volumes:
      - "${KONTEKS_ROOT:?}/validation-runtime/data:/data"
      # The approved task-checkout projection: readable, never writable.
      - "${KONTEKS_ROOT:?}/harness/data/checkouts:/checkouts:ro"
    networks: [control, stores, egress]
    depends_on:
      validation-postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      supervisor:
        condition: service_healthy

  preview-forwarder:
    <<: [*hardening, *small]
    image: "${KONTEKS_PREVIEW_FORWARDER_IMAGE:?}"
    user: "10040:10040"
    # Shares the Validation Runtime's network namespace so "loopback" IS the
    # local preview origin; it listens for no viewer and maps nothing until
    # the operator enables preview AND a grant exists.
    network_mode: "service:validation-runtime"
    environment:
      PREVIEW_FORWARDER_SUPERVISOR_URL: ws://supervisor:41820
      PREVIEW_FORWARDER_STATUS_PORT: "41860"
    depends_on:
      validation-runtime:
        condition: service_healthy

  # ── Agent runners: one container per family; profile selects auth mode ───
  # `runner-<agent>` egresses directly (agent_local_subscription);
  # `runner-<agent>-keyed` sits on control + keyed only, so its sole provider
  # route is the gateway. Both answer as `runner-<agent>` on the control
  # network. Each has a private credential volume no other service mounts.
  runner-claude-code:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_CLAUDE_CODE_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-claude-code-subscription"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: claude-code
      RUNNER_AUTH_MODE: agent_local_subscription
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_CLAUDE_CODE_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/claude-code:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-claude-code]
      egress: {}

  runner-claude-code-keyed:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_CLAUDE_CODE_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-claude-code-keyed"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: claude-code
      RUNNER_AUTH_MODE: gateway_keyed
      RUNNER_GATEWAY_BASE_URL: http://gateway:41810
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_CLAUDE_CODE_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/claude-code:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-claude-code]
      keyed: {}

  runner-codex:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_CODEX_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-codex-subscription"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: codex
      RUNNER_AUTH_MODE: agent_local_subscription
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_CODEX_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/codex:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-codex]
      egress: {}

  runner-codex-keyed:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_CODEX_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-codex-keyed"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: codex
      RUNNER_AUTH_MODE: gateway_keyed
      RUNNER_GATEWAY_BASE_URL: http://gateway:41810
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_CODEX_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/codex:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-codex]
      keyed: {}

  runner-opencode:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_OPENCODE_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-opencode-subscription"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: opencode
      RUNNER_AUTH_MODE: agent_local_subscription
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_OPENCODE_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/opencode:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-opencode]
      egress: {}

  runner-opencode-keyed:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_OPENCODE_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-opencode-keyed"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: opencode
      RUNNER_AUTH_MODE: gateway_keyed
      RUNNER_GATEWAY_BASE_URL: http://gateway:41810
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_OPENCODE_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/opencode:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-opencode]
      keyed: {}

  runner-pi:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_PI_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-pi-subscription"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: pi
      RUNNER_AUTH_MODE: agent_local_subscription
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_PI_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/pi:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-pi]
      egress: {}

  runner-pi-keyed:
    <<: *runner-base
    image: "${KONTEKS_RUNNER_PI_IMAGE:-unset}"
    user: "10030:10030"
    profiles: ["runner-pi-keyed"]
    environment:
      <<: *runner-env
      RUNNER_AGENT_ID: pi
      RUNNER_AUTH_MODE: gateway_keyed
      RUNNER_GATEWAY_BASE_URL: http://gateway:41810
      RUNNER_BRIDGE_VERSION: "${KONTEKS_RUNNER_PI_BRIDGE_VERSION:-unknown}"
    volumes:
      - "${KONTEKS_ROOT:?}/credentials/pi:/credentials"
      - "${KONTEKS_ROOT:?}/harness/data/workspaces:/workspace"
    networks:
      control:
        aliases: [runner-pi]
      keyed: {}
